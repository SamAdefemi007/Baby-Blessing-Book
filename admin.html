<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Blessing Book | Parents</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--cream:#f8f5ed;--paper:#fffdf8;--sage:#405845;--gold:#b99a62;--ink:#38453c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 'DM Sans',sans-serif}.wrap{max-width:960px;margin:0 auto;padding:36px 20px 80px}.head{text-align:center;margin:10px 0 30px}.eyebrow{text-transform:uppercase;letter-spacing:.23em;font-size:11px;color:#9c8257}h1,h2{font-family:'Playfair Display',serif;font-weight:500;color:var(--sage)}h1{font-size:clamp(34px,7vw,52px);margin:10px 0}h2{font-size:24px}.panel,.blessing{background:var(--paper);border:1px solid #e7e0d1;border-radius:17px;padding:24px;box-shadow:0 7px 24px #38453c0a}.panel{max-width:550px;margin:0 auto}.hidden{display:none!important}input{padding:12px 14px;border:1px solid #d7dccc;border-radius:9px;width:100%;font:inherit;margin:7px 0 15px}button{background:var(--sage);color:white;border:0;border-radius:9px;padding:12px 17px;font:600 13px 'DM Sans',sans-serif;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#e9eee5;color:var(--sage)}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:18px 0 25px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:15px}.blessing{white-space:pre-wrap;overflow-wrap:anywhere}.blessing p{margin:10px 0}.who{font-weight:700;color:var(--sage)}.meta{color:#8b897d;font-size:12px}.verse{font-style:italic;color:#93784b}.msg{padding:12px 0;border-top:1px solid #eae4d8}.status{color:#876a4c;margin-top:12px}.count{font-size:13px;color:#73796f}@media print{body{background:white}.head{margin:0 0 20px}.tools,#login,.status{display:none!important}.cards{display:block}.blessing{box-shadow:none;break-inside:avoid;margin:0 0 15px}}
</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">For Mum & Dad · Private</div><h1>Our Little Book of Blessings</h1><p>Every prayer, every wish, every word of love. ♡</p></header>
<section id="login" class="panel"><h2>Parents' sign in</h2><p>Enter your email to receive a secure sign-in link. Only approved parent accounts can read the messages.</p><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button type="submit">Email me a sign-in link</button></form><div id="loginStatus" class="status" role="status"></div></section>
<section id="dashboard" class="hidden"><div class="tools"><span class="count" id="count"></span><div class="buttons"><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="csv">Export CSV</button><button class="secondary" id="json">Export JSON</button><button id="pdf">Print / Save PDF</button><button class="secondary" id="logout">Sign out</button></div></div><div id="status" class="status" role="status"></div><div id="cards" class="cards"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const cfg=window.BLESSING_CONFIG,ready=cfg&&cfg.supabaseUrl.startsWith('https://')&&!cfg.supabasePublishableKey.startsWith('PASTE_');
const db=ready?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
let records=[];const el=id=>document.getElementById(id);
function show(id){el('login').classList.toggle('hidden',id!=='login');el('dashboard').classList.toggle('hidden',id!=='dashboard')}
function cell(parent,tag,cls,content){const e=document.createElement(tag);e.className=cls;e.textContent=content||'';parent.appendChild(e);return e}
async function load(){el('status').textContent='Loading blessings…';const {data,error}=await db.from('blessings').select('id,guest_name,relationship,message,bible_verse,created_at').order('created_at',{ascending:false}).limit(1000);if(error){el('status').textContent='Unable to load messages: '+error.message;return;}records=data||[];el('count').textContent=`${records.length} blessing${records.length===1?'':'s'}`;el('cards').replaceChildren();for(const r of records){const c=cell(el('cards'),'article','blessing','');cell(c,'div','who',r.guest_name);cell(c,'div','meta',[r.relationship,new Date(r.created_at).toLocaleString()].filter(Boolean).join(' · '));cell(c,'p','msg',r.message);if(r.bible_verse)cell(c,'p','verse',r.bible_verse);}el('status').textContent=records.length?'':'No blessings yet. They will appear here after guests submit them.';}
async function sessionCheck(){if(!ready){el('loginStatus').textContent='Configure config.js with your Supabase URL and publishable key first.';return;}const {data:{session}}=await db.auth.getSession();if(!session){show('login');return;}const {data,error}=await db.from('blessing_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){show('login');el('loginStatus').textContent='Signed in, but this account has not been approved as a parent. Ask the project owner to add your Auth user ID to blessing_admins.';return;}show('dashboard');await load();}
el('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!ready)return;const email=el('email').value.trim();el('loginStatus').textContent='Sending link…';const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:new URL('admin.html',location.href).href,shouldCreateUser:true}});el('loginStatus').textContent=error?error.message:'Check your email for a secure sign-in link.';});
el('refresh').onclick=load;el('logout').onclick=async()=>{await db.auth.signOut();records=[];show('login');el('loginStatus').textContent='Signed out.'};
function download(name,type,content){const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function csvEscape(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
el('csv').onclick=()=>{const fields=['guest_name','relationship','message','bible_verse','created_at'];download('baby-blessings.csv','text/csv;charset=utf-8','\ufeff'+[fields.join(','),...records.map(r=>fields.map(k=>csvEscape(r[k])).join(','))].join('\r\n'))};
el('json').onclick=()=>download('baby-blessings.json','application/json',JSON.stringify(records,null,2));
el('pdf').onclick=()=>window.print();
if(ready)db.auth.onAuthStateChange(()=>setTimeout(sessionCheck,0));sessionCheck();
</script></body></html>
